<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Скоро в кино — трейлеры и премьеры</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="top__inner">
    <a class="logo" href="#">Скоро в кино</a>
    <nav class="tabs" aria-label="Разделы">
      <button class="tab is-active" data-tab="all">Ближайшие премьеры</button>
      <button class="tab" data-tab="fav">Избранное <span id="favCount" class="badge">0</span></button>
    </nav>
  </div>
</header>

<main>
  <!-- Главный блок: ближайшая премьера -->
  <section class="hero" id="hero" aria-live="polite"></section>

  <!-- Панель фильтров -->
  <section class="controls" aria-label="Фильтры">
    <input id="search" type="search" placeholder="Найти фильм по названию" aria-label="Поиск">
    <select id="genre" aria-label="Жанр"><option value="">Все жанры</option></select>
    <select id="sort" aria-label="Сортировка">
      <option value="date">Сначала ближайшие</option>
      <option value="title">По алфавиту</option>
    </select>
  </section>

    <section id="grid" class="grid" aria-label="Список фильмов"></section>
</main>

<footer class="foot">
  <p>Курсовой проект. Афиши и названия принадлежат их правообладателям.</p>
</footer>

<!-- Окно с информацией и трейлером -->
<div class="modal" id="modal" hidden>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="modal__close" id="mClose" aria-label="Закрыть">×</button>
    <div class="player" id="mPlayer"></div>
    <div class="modal__body">
      <h2 id="mTitle"></h2>
      <p class="modal__meta" id="mMeta"></p>
      <p id="mDesc"></p>
      <dl class="facts" id="mFacts"></dl>
      <div class="modal__actions">
        <button class="btn" id="mFav"></button>
        <a class="btn btn--ghost" id="mYt" target="_blank" rel="noopener">Искать на YouTube</a>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
